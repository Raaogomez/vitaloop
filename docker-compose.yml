# ── VitalLoop one-command local stack: app + Postgres ──
# Usage: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vitaloop
    ports:
      - "5432:5432"
    volumes:
      - vitaloop-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/vitaloop
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me}
      ADMIN_KEY: ${ADMIN_KEY:-dev-admin-key}
      CRON_SECRET: ${CRON_SECRET:-dev-cron-secret}
      TELCO_WEBHOOK_SECRET: ${TELCO_WEBHOOK_SECRET:-dev-telco-secret}
      DCB_MODE: ${DCB_MODE:-simulator}
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  vitaloop-pg:
